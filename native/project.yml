name: LittleHarbour
options:
  bundleIdPrefix: com.littleharbour
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: 20
    HARBOUR_BUNDLE_IDENTIFIER: com.littleharbour.game
    HARBOUR_DISPLAY_NAME: Little Harbour
targets:
  LittleHarbour:
    type: application
    platform: iOS
    sources:
      - path: LittleHarbour
        excludes: [Resources]
      - path: LittleHarbour/Resources
        buildPhase: resources
    info:
      path: LittleHarbour/Info.plist
      properties:
        CFBundleDisplayName: $(HARBOUR_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: false
        LSSupportsOpeningDocumentsInPlace: false
        ITSAppUsesNonExemptEncryption: false
    settings:
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      PRODUCT_BUNDLE_IDENTIFIER: $(HARBOUR_BUNDLE_IDENTIFIER)
      GENERATE_INFOPLIST_FILE: NO
  LittleHarbourTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LittleHarbourTests]
    dependencies:
      - target: LittleHarbour
    settings:
      GENERATE_INFOPLIST_FILE: YES
  LittleHarbourUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LittleHarbourUITests
      - path: LittleHarbourTests/late-town.json
        buildPhase: resources
      - path: LittleHarbourTests/festival-ready.json
        buildPhase: resources
      - path: LittleHarbourTests/festival-opening.json
        buildPhase: resources
      - path: LittleHarbourTests/long-play-ready.json
        buildPhase: resources
      - path: LittleHarbourTests/city-ready.json
        buildPhase: resources
      - path: LittleHarbourTests/crews-ready.json
        buildPhase: resources
      - path: LittleHarbourTests/task-ready.json
        buildPhase: resources
      - path: LittleHarbourTests/task-voyages.json
        buildPhase: resources
    dependencies:
      - target: LittleHarbour
    settings:
      GENERATE_INFOPLIST_FILE: YES
schemes:
  LittleHarbour:
    build:
      targets:
        LittleHarbour: all
    test:
      targets: [LittleHarbourTests, LittleHarbourUITests]
