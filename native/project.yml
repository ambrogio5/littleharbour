name: LittleHarbour
options:
  bundleIdPrefix: com.littleharbour
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: 1
targets:
  LittleHarbour:
    type: application
    platform: iOS
    sources:
      - path: LittleHarbour
        excludes: [Resources]
      - path: LittleHarbour/Resources
        buildPhase: resources
    info:
      path: LittleHarbour/Info.plist
      properties:
        CFBundleDisplayName: Little Harbour
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: false
        LSSupportsOpeningDocumentsInPlace: false
        ITSAppUsesNonExemptEncryption: false
    settings:
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      PRODUCT_BUNDLE_IDENTIFIER: com.littleharbour.game
      GENERATE_INFOPLIST_FILE: NO
  LittleHarbourTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LittleHarbourTests]
    dependencies:
      - target: LittleHarbour
    settings:
      GENERATE_INFOPLIST_FILE: YES
  LittleHarbourUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [LittleHarbourUITests]
    dependencies:
      - target: LittleHarbour
    settings:
      GENERATE_INFOPLIST_FILE: YES
schemes:
  LittleHarbour:
    build:
      targets:
        LittleHarbour: all
    test:
      targets: [LittleHarbourTests, LittleHarbourUITests]
