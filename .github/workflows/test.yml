name: Little Harbour tests
on:
  push:
    branches: [main, 'recovery/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check dist/app.js
          node --check dist/engine.js
          node --check dist/neighbourhood-ui.js
          node --check dist/v2-ui.js
          node --check dist/world-map.js
      - name: Run regression and standalone packaging tests
        run: npm test
      - name: Install browser test driver
        run: npm install --no-save --no-package-lock --ignore-scripts playwright-core
      - name: Interactive browser smoke (mobile and desktop)
        run: node scripts/browser-smoke.mjs
      - name: Build downloadable V2 playtest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run standalone -- ./Little-Harbour-V2-Playtest.html
      - name: Upload standalone V2 HTML
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Little-Harbour-V2-Playtest
          path: Little-Harbour-V2-Playtest.html
          retention-days: 30
          compression-level: 6
          if-no-files-found: error
