name: Native iOS
on:
  pull_request:
    paths: ['native/**', 'dist/**', '.github/workflows/native-ios.yml']
  push:
    branches: [main]
    paths: ['native/**', 'dist/**', '.github/workflows/native-ios.yml']
  workflow_dispatch:
concurrency:
  group: native-ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node native/scripts/bundle-engine.mjs --check
      - run: node --test native/scripts/bridge.test.mjs
      - run: node native/scripts/verify-art.mjs
      - run: node native/scripts/campaign.mjs --check
  simulator:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select available iPhone simulator
        run: |
          xcrun simctl list devices available -j > /tmp/simulators.json
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          devices = json.load(open('/tmp/simulators.json'))['devices']
          phone = next(d for group in devices.values() for d in group if d['name'].startswith('iPhone'))
          print('SIMULATOR_ID=' + phone['udid'])
          PY
      - name: Boot simulator before testing
        run: |
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
      - name: Build and run native engine, recovery and UI tests
        run: xcodebuild -project native/LittleHarbour.xcodeproj -scheme LittleHarbour -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -parallel-testing-enabled NO -resultBundlePath NativeTests.xcresult CODE_SIGNING_ALLOWED=NO test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-test-results
          path: NativeTests.xcresult
          retention-days: 14
